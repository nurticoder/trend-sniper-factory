name: tests
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/demo/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/demo/**'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
