[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-sniper-factory"
version = "0.2.0"
description = "Local-first creator control room and original video production tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow==13.0.0", "imageio-ffmpeg==0.8.0"]

[project.optional-dependencies]
voice = ["kokoro-onnx==0.4.7", "soundfile==0.14.0"]
piper = ["piper-tts==1.8.0"]
worker = ["yt-dlp==2026.10.26"]
publish = ["google-api-python-client>=2.100,<3", "google-auth-oauthlib>=1.2,<2"]
web = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2", "starlette==1.10.0"]
test = ["httpx2==2.16.0"]

[project.scripts]
trend-sniper = "trend_sniper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trend_sniper.web" = ["static/*"]
