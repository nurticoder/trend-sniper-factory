[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-sniper-factory"
version = "0.1.0"
description = "Offline original animated Shorts with provenance and review gates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow==13.0.0", "imageio-ffmpeg==0.8.0"]

[project.scripts]
trend-sniper = "trend_sniper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
